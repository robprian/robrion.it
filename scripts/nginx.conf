server {
    listen 80;
    listen [::]:80;
    server_name robrion.my.id www.robrion.my.id;

    # Redirect HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name robrion.my.id www.robrion.my.id;

    root /var/www/robrion;
    index index.php index.html;

    # SSL (sesuaikan path sertifikat)
    ssl_certificate     /etc/letsencrypt/live/robrion.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/robrion.my.id/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Charset
    charset utf-8;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── PENTING: Front Controller Routing ──
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include        fastcgi_params;
        fastcgi_pass   unix:/run/php-fpm/www.sock;  # sesuaikan socket path
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Blokir akses ke .htaccess dan file tersembunyi
    location ~ /\. {
        deny all;
    }

    # Blokir akses langsung ke folder views, config, scripts
    location ~ ^/(views|config|scripts)/ {
        deny all;
    }
}
